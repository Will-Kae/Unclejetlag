# Uncle Jetlag 2.0 preservation harness (Phase 1A).
# Runs on pull requests only. It never deploys, never touches Vercel and never calls partner services:
# end-to-end tests run against a local `next start` with all third-party requests blocked.
name: Preservation harness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://unclejetlag.com
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  unit:
    name: Unit, data and affiliate contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Routes, links and integrations (local build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  passport-db:
    name: Isolated passport PostgreSQL security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: passport_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d passport_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local_ci_only
      PGDATABASE: passport_ci
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f tests/passport/sql/ci-bootstrap.sql
      - name: Apply staged passport migrations
        run: |
          set -euo pipefail
          for file in supabase/migrations/*passport*.sql; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Assert schema and privileges
        run: psql -v ON_ERROR_STOP=1 -f tests/passport/sql/structural-security.sql
      - name: Test evidence transaction lifecycle
        run: psql -v ON_ERROR_STOP=1 -f tests/passport/sql/transactional-security.sql
      - name: Assert audit failure atomic rollback
        run: psql -v ON_ERROR_STOP=1 -f tests/passport/sql/audit-rollback.sql
      - name: Reject concurrent duplicate approvals
        run: bash tests/passport/concurrent-review.sh
