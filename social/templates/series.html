<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url(../../src/app/fonts/fraunces-standard-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Fraunces;font-style:italic;src:url(../../src/app/fonts/fraunces-standard-italic.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Inter;src:url(../../src/app/fonts/inter-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Mono;src:url(../../src/app/fonts/jetbrains-mono-wght-normal.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0e1a24;--paper:#faf7f2;--sand:#efe8dc;--acc:#ff7a4d}
body{width:1080px;height:1350px;overflow:hidden;font-family:Inter;color:var(--paper);background:#101c30}
.wrap{position:relative;width:100%;height:100%;padding:72px;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;background:radial-gradient(60% 40% at 90% 4%,color-mix(in srgb,var(--acc) 42%,transparent),transparent 70%),radial-gradient(55% 50% at 0% 100%,rgba(28,78,128,.55),transparent 70%),linear-gradient(180deg,#101c30,#0b1422)}
.top{position:relative;display:flex;justify-content:space-between;align-items:center}
.logo{height:110px}
.pill{font-family:Mono;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--acc);border-radius:999px;padding:14px 24px;font-weight:700;white-space:nowrap}
.kicker{position:relative;margin-top:84px;font-family:Mono;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
h1{position:relative;font-family:Fraunces;font-weight:650;font-size:var(--h1,96px);line-height:1;letter-spacing:-.03em;margin-top:22px}
h1 em{font-style:italic;font-weight:500;color:var(--acc)}
.card{position:relative;margin-top:auto;background:var(--paper);color:var(--ink);border-radius:28px;padding:44px 48px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.row{display:flex;gap:22px;align-items:flex-start;padding:16px 0;border-bottom:2px solid rgba(14,26,36,.08);font-size:30px;line-height:1.35}
.row:last-child{border-bottom:0}
.row b{display:inline-block;min-width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--ink);font-family:Mono;font-size:22px;text-align:center;line-height:44px;flex:none}
.src{margin-top:18px;font-family:Mono;font-size:18px;letter-spacing:.06em;color:#6b7280}
.foot{position:relative;display:flex;justify-content:space-between;margin-top:36px;font-family:Mono;font-size:22px;letter-spacing:.12em;color:rgba(250,247,242,.72)}
.foot b{color:var(--paper)}
</style></head><body><div class="wrap">
<div class="bg"></div>
<div class="top"><img class="logo" src="logo.png" alt=""><div class="pill">PILL</div></div>
<div class="kicker">KICKER</div>
<h1>HEAD</h1>
<div class="card">ROWS<div class="src">SRC</div></div>
<div class="foot"><span>unclejetlag.com</span><b>@unclejetlag</b></div>
</div></body></html>
